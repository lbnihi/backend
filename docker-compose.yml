services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside compose the database host is the `db` service.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/qalbalkhalij}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qalbalkhalij
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d qalbalkhalij"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
